# Retailrocket Ingestion and Behavioral Proxy Mapping Configuration
# Single source of truth for historical dataset filtering and proxy alignment

retailrocket:
  raw_data_dir: "RetailRocket_Dataset"
  output_db_path: "backend/historical.db"
  
  # Stage filtering thresholds
  filters:
    # 1. Exact / near duplicate event removal within rolling window (seconds)
    dedup_window_seconds: 60
    
    # 2. Extreme bot activity capping (events per visitor)
    max_events_per_visitor: 500
    
    # 3. Item activity filtering thresholds
    min_events_per_item: 3
    min_visitors_per_item: 2
    
    # 4. Critical retention guarantee: ALWAYS keep all transaction events
    always_keep_transactions: true

  # 30-minute inactivity sessionization
  sessionization:
    inactivity_window_minutes: 30
    inactivity_window_ms: 1800000

  # Retailrocket-to-Catalog Proxy Mapping
  mapping:
    random_seed: 42
    n_clusters: 6
    mapping_version: "v1.0"
    svd_components: 16
    cooccurrence_window_sessions: true

